*{box-sizing:border-box;margin:0;padding:0;min-width:0}
html{scroll-behavior:smooth;background:#080808;color:#f2f2f0;-webkit-font-smoothing:antialiased;overflow-x:hidden;max-width:100vw}
body{font-family:'Space Grotesk',system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:#080808;color:#f2f2f0;overflow-x:hidden;line-height:1.5;max-width:100vw;width:100%}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit}
::selection{background:#f2f2f0;color:#080808}
.site{min-height:100vh;background:#080808;position:relative;width:100%;max-width:100vw;overflow-x:hidden;overflow-x:clip}
.curved-banner{position:relative;overflow:hidden;background:#f2f2f0;color:#080808;border-bottom:1px solid #080808;height:56px;display:flex;align-items:center;width:100%;max-width:100vw}
.curved-banner svg{width:100%;max-width:100%;height:56px;flex-shrink:0;display:block}
.curved-banner text{font-family:'Anton',Impact,sans-serif;font-size:22px;letter-spacing:.08em;text-transform:uppercase}
.top-nav{display:flex;justify-content:space-between;align-items:center;padding:14px 24px;max-width:1240px;margin:0 auto;width:100%;box-sizing:border-box;font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.7}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px;width:100%;box-sizing:border-box;overflow-x:hidden}
.hero{display:grid;grid-template-columns:1fr;gap:32px;padding:56px 0 32px;position:relative;width:100%;max-width:100%}
.hero-badge{display:inline-flex;align-items:center;gap:10px;border:1px solid #222;padding:8px 14px;border-radius:100px;font-size:12px;letter-spacing:.04em;background:#111;color:#cfcfca}
.dot{width:6px;height:6px;background:#c8ff00;border-radius:50%;box-shadow:0 0 12px #c8ff00;flex-shrink:0}
.hero-main{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:32px;align-items:center;width:100%}
@media(max-width:900px){.hero-main{grid-template-columns:minmax(0,1fr)}.wrap{padding:0 18px}.top-nav{padding:12px 18px}}
.h-title{font-family:'Anton',Impact,sans-serif;font-size:clamp(48px,9vw,112px);line-height:.88;letter-spacing:-.02em;text-transform:uppercase}
.h-title span{display:block}
.h-title .line2{color:#f2f2f0}
.h-sub{margin-top:18px;font-size:clamp(15px,1.6vw,19px);line-height:1.5;color:#a8a8a3;max-width:560px}
.h-sub strong{color:#f2f2f0;font-weight:600}
.terminal-line{margin-top:28px;display:flex;gap:10px;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:12px;color:#6b6b67;border-top:1px solid #1c1c1c;padding-top:14px}
.avatar-wrap{position:relative;perspective:1000px;width:100%;max-width:512px;aspect-ratio:1/1;margin:0 auto;overflow:hidden;border-radius:32px}
.avatar-card{width:100%;height:100%;position:relative;transform-style:preserve-3d;will-change:transform;transition:transform .15s ease-out;border-radius:32px;overflow:hidden;background:#111;border:1px solid #222}
.avatar-card img{width:100%;height:100%;object-fit:cover;filter:grayscale(10%) contrast(1.05)}
.avatar-glow{position:absolute;inset:0;background:radial-gradient(600px at var(--mx,50%) var(--my,50%),rgba(200,255,0,.18),transparent 60%);pointer-events:none;mix-blend-mode:screen}
.avatar-meta{position:absolute;bottom:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#f2f2f0;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.1);padding:8px 10px;border-radius:12px}
.section{padding:48px 0;border-top:1px solid #151515;width:100%;max-width:100%;overflow:hidden}
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:28px;flex-wrap:wrap}
.section-title{font-family:'Anton',sans-serif;font-size:clamp(28px,4vw,48px);line-height:.9;text-transform:uppercase;letter-spacing:-.01em}
.section-kicker{font-family:ui-monospace,monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#7a7a76}
.projects-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;width:100%}
@media(max-width:900px){.projects-grid{grid-template-columns:minmax(0,1fr)}}
.p-card{border:1px solid #1e1e1e;background:#0f0f0f;border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px;min-height:280px;position:relative;overflow:hidden;transition:border-color .2s;min-width:0}
.p-card:hover{border-color:#2a2a2a}
.p-tag{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#c8ff00;border:1px solid #2a2a2a;padding:6px 10px;border-radius:100px;display:inline-flex;align-self:flex-start;background:#141414}
.p-title{font-size:20px;line-height:1.25;font-weight:700;letter-spacing:-.01em}
.p-desc{font-size:14px;line-height:1.6;color:#9a9a95}
.p-stats{display:flex;gap:12px;margin-top:auto;padding-top:14px;border-top:1px solid #1a1a1a;font-family:ui-monospace,monospace;font-size:11px;color:#6f6f6b}
.testimonial{background:#f2f2f0;color:#080808;border-radius:28px;padding:28px;display:grid;grid-template-columns:80px minmax(0,1fr);gap:18px;align-items:start;width:100%;box-sizing:border-box}
@media(max-width:600px){.testimonial{grid-template-columns:minmax(0,1fr)}}
.t-quote{font-size:clamp(18px,2.2vw,24px);line-height:1.3;font-weight:700;letter-spacing:-.02em}
.t-meta{margin-top:12px;font-family:ui-monospace,monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.6}
.t-icon{width:56px;height:56px;border-radius:50%;background:#080808;color:#f2f2f0;display:grid;place-items:center;font-family:'Anton';font-size:28px}
.blog-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;width:100%}
@media(max-width:900px){.blog-grid{grid-template-columns:minmax(0,1fr)}}
.b-card{border:1px solid #1e1e1e;background:#0f0f0f;border-radius:20px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .2s;min-width:0}
.b-card:hover{border-color:#2e2e2e}
.b-thumb{aspect-ratio:16/10;background:#151515;display:grid;place-items:center;color:#3a3a38;font-family:'Anton';font-size:32px;letter-spacing:.04em;text-transform:uppercase;border-bottom:1px solid #1e1e1e}
.b-body{padding:18px 20px;display:flex;flex-direction:column;gap:10px;flex:1}
.b-kicker{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#7a7a76}
.b-title{font-size:18px;line-height:1.3;font-weight:700}
.b-excerpt{font-size:13px;line-height:1.6;color:#8c8c87;margin-top:auto}
.game-section{background:#0c0c0c;border:1px solid #1c1c1c;border-radius:28px;padding:20px;overflow:hidden;width:100%;box-sizing:border-box;max-width:100%}
.game-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.game-title{font-family:'Anton';font-size:28px;text-transform:uppercase;display:flex;align-items:center;gap:12px}
.game-canvas-wrap{position:relative;background:#080808;border:1px solid #222;border-radius:16px;overflow:hidden;aspect-ratio:16/5;max-height:240px;display:grid;place-items:center}
canvas{width:100%;height:100%;display:block;touch-action:none;user-select:none}
.game-controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btn{border:1px solid #2a2a2a;background:#151515;color:#f2f2f0;padding:10px 16px;border-radius:100px;font-size:13px;letter-spacing:.02em;cursor:pointer;transition:all .18s;display:inline-flex;align-items:center;gap:8px;touch-action:manipulation;user-select:none;-webkit-tap-highlight-color:transparent}
.btn:hover{background:#1e1e1e;border-color:#3a3a3a;transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn-primary{background:#f2f2f0;color:#080808;border-color:#f2f2f0}
.btn-primary:hover{background:#fff}
.contact-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;width:100%}
@media(max-width:700px){.contact-grid{grid-template-columns:minmax(0,1fr)}}
.contact-card{border:1px solid #1e1e1e;background:#0f0f0f;border-radius:20px;padding:20px;min-width:0;overflow:hidden}
.contact-label{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#7a7a76;margin-bottom:8px}
.contact-value{font-size:20px;font-weight:700;word-break:break-all}
.contact-link{color:#f2f2f0;border-bottom:1px dashed #444;padding-bottom:2px}
.footer{padding:28px 0 40px;border-top:1px solid #151515;margin-top:24px;display:flex;flex-direction:column;gap:12px;width:100%;max-width:100%;overflow:hidden;box-sizing:border-box}
.footer-top{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-family:ui-monospace,monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#6a6a66}
.footer-contact{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-family:ui-monospace,monospace;font-size:12px;color:#a8a8a3}
.footer-contact a{color:#f2f2f0;text-decoration:underline;text-decoration-color:#333;text-underline-offset:4px}
.footer-contact a:hover{text-decoration-color:#f2f2f0}
.skip{position:absolute;left:-9999px}
.game-status{font-family:ui-monospace,monospace;font-size:11px;color:#c8ff00;min-height:16px}
