.banner{background:#fff;color:#000;padding:10px 18px;font-size:20px;letter-spacing:.04em;transform:rotate(-2.5deg);box-shadow:0 0 0 2px #fff,8px 8px 0 #FF00FF;white-space:nowrap;display:inline-block;will-change:transform;max-width:92vw;box-sizing:border-box}

.btn{background:#FF00FF;color:#000;border-color:#FF00FF;box-shadow:4px 4px 0 #fff}
.btn:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 #fff}
.btn-o{background:transparent;color:#fff}
.btn-o:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 #FF00FF;border-color:#FF00FF}
.avatar-box{width:100%;max-width:512px;aspect-ratio:1/1;position:relative;background:#121212;border:2px solid #fff;border-radius:28px;overflow:hidden;min-height:0;contain:content}
@media(max-width:900px){.avatar-box{max-width:100%;min-height:0;aspect-ratio:1/1;margin:0 auto}}

@media(max-width:900px){.glow{inset:0}}
.avatar-box img{position:relative;width:100%;height:100%;object-fit:cover;display:block;aspect-ratio:1/1}
.sec{padding:40px 0;border-top:1px solid #222}
.sec h2{font-size:clamp(28px,4vw,44px);margin:0 0 18px;line-height:.95}

@media(max-width:900px){.grid3{grid-template-columns:1fr}}
.card{border:2px solid #fff;background:#141414;padding:18px;position:relative;transition:transform .14s,box-shadow .14s;min-height:168px}
.card:hover{transform:translate(-3px,-3px);box-shadow:5px 5px 0 #FF00FF}
.tag{font-size:11px;letter-spacing:.12em;border:1px solid #444;padding:4px 8px;display:inline-block;margin-bottom:10px;color:#bbb}
.card h3{margin:0 0 8px;font-size:18px;line-height:1.1}
.card p{margin:0;color:#bdbdbd;font-size:14px;line-height:1.45}
.quote{border-left:3px solid #FF00FF;padding-left:14px;margin-top:12px;font-size:13px;color:#e6e6e6}

.foot{padding:28px 0 36px;border-top:2px solid #fff;background:#0a0a0a;color:#9a9a9a;font-size:13px}
.foot a{color:#fff;text-decoration:none;border-bottom:1px solid #FF00FF;padding-bottom:1px}
.foot a:hover{color:#FF00FF}
.foot-top{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;margin-bottom:12px;color:#fff}
.badge{display:inline-flex;gap:8px;align-items:center;background:#111;border:1px solid #2a2a2a;padding:6px 10px;border-radius:999px;font-size:12px;color:#ccc}
