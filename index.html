*{box-sizing:border-box}
html{scroll-behavior:smooth;background:#0a0a0a}
body{margin:0;background:#0a0a0a;color:#fff;font-family:ui-sans-system,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5;overflow-x:hidden}
a{color:inherit}
.font-d{font-family:Impact,'Arial Black',system-ui,sans-serif;font-weight:900;letter-spacing:.02em;text-transform:uppercase;line-height:.9}
.font-m{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}
.top{padding:22px 0 10px;overflow:hidden;min-height:78px;max-width:100vw}
.banner{background:#fff;color:#000;padding:10px 18px;font-size:20px;letter-spacing:.04em;transform:rotate(-2.5deg);box-shadow:0 0 0 2px #fff,8px 8px 0 #FF00FF;white-space:nowrap;display:inline-block;will-change:transform;max-width:92vw;box-sizing:border-box}
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:32px;align-items:center;padding:24px 0 48px;min-height:560px}
@media(max-width:900px){.hero{grid-template-columns:1fr;min-height:auto;gap:20px}.wrap{padding:0 16px;max-width:100vw;overflow:hidden}.banner{font-size:13px;transform:none;white-space:normal;word-break:break-word;line-height:1.15;box-shadow:0 0 0 2px #fff,4px 4px 0 #FF00FF;display:block;width:100%;max-width:100%;text-align:center}}
.h1{font-size:clamp(42px,7vw,86px);margin:0;line-height:.92;letter-spacing:-.02em}
.h1 span{color:transparent;-webkit-text-stroke:1.5px #fff}
.h1 em{font-style:normal;color:#FF00FF}
.lead{margin:18px 0 0;font-size:18px;max-width:48ch;color:#d6d6d6}
.cta{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap}
.btn,.btn-o{display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 22px;border:2px solid #fff;font-weight:700;text-decoration:none;font-size:14px;letter-spacing:.04em;transition:transform .12s,box-shadow .12s}
.btn{background:#FF00FF;color:#000;border-color:#FF00FF;box-shadow:4px 4px 0 #fff}
.btn:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 #fff}
.btn-o{background:transparent;color:#fff}
.btn-o:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 #FF00FF;border-color:#FF00FF}
.avatar-box{width:100%;max-width:512px;aspect-ratio:1/1;position:relative;background:#121212;border:2px solid #fff;border-radius:28px;overflow:hidden;min-height:0;contain:content}
@media(max-width:900px){.avatar-box{max-width:100%;min-height:0;aspect-ratio:1/1;margin:0 auto}}
.glow{position:absolute;inset:0;background:radial-gradient(60% 60% at 50% 38%,rgba(255,0,255,.9) 0%,rgba(255,0,255,.18) 54%,transparent 74%);filter:blur(18px);pointer-events:none;max-width:100%}
@media(max-width:900px){.glow{inset:0}}
.avatar-box img{position:relative;width:100%;height:100%;object-fit:cover;display:block;aspect-ratio:1/1}
.sec{padding:40px 0;border-top:1px solid #222}
.sec h2{font-size:clamp(28px,4vw,44px);margin:0 0 18px;line-height:.95}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:900px){.grid3{grid-template-columns:1fr}}
.card{border:2px solid #fff;background:#141414;padding:18px;position:relative;transition:transform .14s,box-shadow .14s;min-height:168px}
.card:hover{transform:translate(-3px,-3px);box-shadow:5px 5px 0 #FF00FF}
.tag{font-size:11px;letter-spacing:.12em;border:1px solid #444;padding:4px 8px;display:inline-block;margin-bottom:10px;color:#bbb}
.card h3{margin:0 0 8px;font-size:18px;line-height:1.1}
.card p{margin:0;color:#bdbdbd;font-size:14px;line-height:1.45}
.quote{border-left:3px solid #FF00FF;padding-left:14px;margin-top:12px;font-size:13px;color:#e6e6e6}
[data-rv]{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s cubic-bezier(.16,1,.3,1)}
[data-rv].rv{opacity:1;transform:none}
.foot{padding:28px 0 36px;border-top:2px solid #fff;background:#0a0a0a;color:#9a9a9a;font-size:13px}
.foot a{color:#fff;text-decoration:none;border-bottom:1px solid #FF00FF;padding-bottom:1px}
.foot a:hover{color:#FF00FF}
.foot-top{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;margin-bottom:12px;color:#fff}
